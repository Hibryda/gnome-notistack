[package]
name = "gnome-notistack"
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
description = "Standalone FreeDesktop notification daemon for GNOME Shell 48 / X11 — a vertical stack of override-redirect popups (dunst-style, on GNOME)"
license = "MIT"
repository = "https://git.hemoglobina.store/hibryda/gnome-notistack"
default-run = "gnome-notistack"

[[bin]]
name = "gnome-notistack"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
cairo-rs = { version = "0.21.5", features = ["xcb"] }
clap = { version = "4.6.1", features = ["derive"] }
freedesktop-icons = "0.4.0"
gio = "0.21"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pango = "0.21.5"
pangocairo = "0.21.5"
resvg = "0.47.0"
sd-notify = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "process"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
x11rb = { version = "0.13.2", features = ["allow-unsafe-code", "randr", "shape", "xfixes"] }
zbus = { version = "5.16.0", default-features = false, features = ["tokio"] }

# SVG icons use pure-Rust resvg/usvg (no C dep, no gtk-rs version coupling) —
# chosen over librsvg-rebind 0.3 which requires rustc >= 1.92 (target is 1.91).

[package.metadata.deb]
maintainer = "hibryda <guess.crypto@proton.me>"
section = "x11"
priority = "optional"
# $auto resolves the binary's shared-lib deps via dpkg-shlibdeps (cairo, pango,
# glib, xcb, …). SVG is pure-Rust resvg, so there is no librsvg2 dependency.
depends = "$auto"
# Compile the bundled GSettings schema on install/removal (the daemon reads it
# via GSETTINGS_SCHEMA_DIR; the prefs window via the extension's schemas dir).
maintainer-scripts = "../packaging/debian/"
assets = [
    ["target/release/gnome-notistack", "usr/lib/gnome-notistack/gnome-notistack", "755"],
    ["../packaging/gnome-notistack.service", "usr/lib/systemd/user/gnome-notistack.service", "644"],
    ["../extension/extension.js", "usr/share/gnome-shell/extensions/notistack@hemoglobina.store/extension.js", "644"],
    ["../extension/handshake.js", "usr/share/gnome-shell/extensions/notistack@hemoglobina.store/handshake.js", "644"],
    ["../extension/prefs.js", "usr/share/gnome-shell/extensions/notistack@hemoglobina.store/prefs.js", "644"],
    ["../extension/metadata.json", "usr/share/gnome-shell/extensions/notistack@hemoglobina.store/metadata.json", "644"],
    ["../extension/schemas/org.gnome.shell.extensions.notistack.gschema.xml", "usr/share/gnome-shell/extensions/notistack@hemoglobina.store/schemas/org.gnome.shell.extensions.notistack.gschema.xml", "644"],
]
